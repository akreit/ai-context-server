server {
  host = "localhost"
  port = 8080
}

claude {
  api-key = ${LLM_API_KEY}
  model = "claude-haiku-4-5-20251001"
  max-tokens = 4096
  system-prompt = "You are a helpful assistant with access to development tools and project documentation. Keep answers very short."
}

mcp-servers {
  github {
    command = "bunx"
    args = ["-y", "@modelcontextprotocol/server-github"]
    env = {
      GITHUB_PERSONAL_ACCESS_TOKEN = ${GITHUB_TOKEN}
    }
  }
}